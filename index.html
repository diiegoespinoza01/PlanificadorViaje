<title>Itinerario Europa · Febrero 2027</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #fafaf9;
    --cell-bg: #ffffff;
    --border: #e2e2e0;
    --text: #2b2b28;
    --muted: #9a968f;
    --accent: #6b6560;
    --today-bg: #fff8ec;
    --today-border: #e8d9b5;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding: 20px 24px 12px;
  }

  h1 {
    font-size: 1.25rem;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 0.8rem;
    color: var(--muted);
  }

  .toolbar button {
    font-family: inherit;
    font-size: 0.78rem;
    color: var(--accent);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
  }

  .toolbar button:hover {
    background: #f0efec;
  }

  #save-status {
    min-width: 90px;
  }

  .weekday-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 10px;
    padding: 0 24px;
  }

  .weekday-row div {
    text-align: center;
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    padding: 4px 0;
  }

  .calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 10px;
    padding: 8px 24px 28px;
  }

  .day-cell {
    background: var(--cell-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    min-height: 190px;
    overflow: hidden;
  }

  .day-cell.today {
    background: var(--today-bg);
    border-color: var(--today-border);
  }

  .day-number {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--accent);
    padding: 8px 10px 4px;
  }

  .day-cell textarea {
    flex: 1;
    width: 100%;
    border: none;
    background: transparent;
    resize: vertical;
    font-family: inherit;
    font-size: 0.85rem;
    line-height: 1.4;
    color: var(--text);
    padding: 0 10px 10px;
    outline: none;
    min-height: 140px;
  }

  .day-cell textarea::placeholder {
    color: #c9c6c0;
  }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.72rem;
    padding: 0 24px 24px;
  }

  @media (max-width: 900px) {
    .calendar, .weekday-row { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; padding-left: 12px; padding-right: 12px; }
    header { padding-left: 12px; padding-right: 12px; }
    .day-number { font-size: 0.7rem; padding: 6px 6px 2px; }
    .day-cell textarea { font-size: 0.78rem; padding: 0 6px 6px; min-height: 100px; }
    .day-cell { min-height: 130px; }
  }
</style>

<header>
  <h1>Itinerario Europa · Febrero 2027</h1>
  <div class="toolbar">
    <span id="save-status">Guardado</span>
    <button id="export-btn" type="button">Exportar copia</button>
    <button id="import-btn" type="button">Importar copia</button>
    <button id="clear-btn" type="button">Vaciar todo</button>
    <input id="import-input" type="file" accept="application/json" hidden />
  </div>
</header>

<div class="weekday-row">
  <div>Lun</div>
  <div>Mar</div>
  <div>Mié</div>
  <div>Jue</div>
  <div>Vie</div>
  <div>Sáb</div>
  <div>Dom</div>
</div>

<div class="calendar" id="calendar"></div>

<footer>Los datos se guardan automáticamente en este navegador (localStorage). Usa "Exportar copia" para tener un respaldo.</footer>

<script>
  const STORAGE_KEY = "itinerario-europa-febrero-2027";
  const TOTAL_DAYS = 28; // Febrero 2027 no es bisiesto, y el 1 cae en lunes
  const calendarEl = document.getElementById("calendar");
  const saveStatusEl = document.getElementById("save-status");

  const todayISO = new Date().toISOString().slice(0, 10);

  function loadData() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    } catch (e) {
      return {};
    }
  }

  let data = loadData();
  let saveTimer = null;

  function persist() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    saveStatusEl.textContent = "Guardado";
  }

  function scheduleSave() {
    saveStatusEl.textContent = "Guardando…";
    clearTimeout(saveTimer);
    saveTimer = setTimeout(persist, 400);
  }

  for (let day = 1; day <= TOTAL_DAYS; day++) {
    const dateStr = `2027-02-${String(day).padStart(2, "0")}`;

    const cell = document.createElement("div");
    cell.className = "day-cell";
    if (dateStr === todayISO) cell.classList.add("today");

    const label = document.createElement("div");
    label.className = "day-number";
    label.textContent = `${day} de febrero`;
    cell.appendChild(label);

    const textarea = document.createElement("textarea");
    textarea.placeholder = "Destinos, paradas, alojamiento, horarios…";
    textarea.value = data[dateStr] || "";
    textarea.addEventListener("input", () => {
      data[dateStr] = textarea.value;
      scheduleSave();
    });
    cell.appendChild(textarea);

    calendarEl.appendChild(cell);
  }

  document.getElementById("export-btn").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "itinerario-europa-febrero-2027.json";
    a.click();
    URL.revokeObjectURL(url);
  });

  document.getElementById("import-btn").addEventListener("click", () => {
    document.getElementById("import-input").click();
  });

  document.getElementById("import-input").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const imported = JSON.parse(reader.result);
        data = imported;
        persist();
        document.querySelectorAll(".day-cell textarea").forEach((ta, i) => {
          const day = i + 1;
          const dateStr = `2027-02-${String(day).padStart(2, "0")}`;
          ta.value = data[dateStr] || "";
        });
      } catch (err) {
        alert("El archivo no tiene un formato válido.");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  document.getElementById("clear-btn").addEventListener("click", () => {
    if (!confirm("¿Vaciar todo el itinerario? Esta acción no se puede deshacer.")) return;
    data = {};
    persist();
    document.querySelectorAll(".day-cell textarea").forEach((ta) => (ta.value = ""));
  });
</script>
